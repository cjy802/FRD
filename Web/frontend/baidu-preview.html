<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>百度地图 JSAPI Three 接入预览</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.5 'Segoe UI', 'Microsoft YaHei UI', sans-serif; color: #242424; background: #edf4fa; }
      #map { position: fixed; inset: 0; }
      .toolbar { position: fixed; z-index: 2; top: 16px; left: 16px; max-width: min(380px, calc(100% - 32px)); padding: 12px 14px; border: 1px solid #d8dde3; background: #fff; }
      .toolbar strong { display: block; font-size: 18px; }
      .toolbar p { margin: 5px 0 8px; color: #5d6670; }
      .toolbar a { color: #0f6cbd; }
      #status { margin-top: 8px; color: #835400; }
    </style>
    <script>
      window.MAPV_BASE_URL = '/mapvthree/'
      window._disable_hmt = true
    </script>
  </head>
  <body>
    <div id="map" aria-label="百度地图 JSAPI Three 预览"></div>
    <div class="toolbar">
      <strong>百度地图 JSAPI Three 预览</strong>
      <p>用于核对依赖、静态资源和浏览器端 AK。预览中心采用官方示例坐标。</p>
      <a href="/">返回航线工作台</a>
      <div id="status" role="status">正在检查配置…</div>
    </div>
    <script type="module" src="/src/baidu-preview.ts"></script>
  </body>
</html>
