<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手动打码工具 - 抽帧浏览与画框</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14161a; color: #e8eaed;
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  #toolbar {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px 12px; background: #1d2026; border-bottom: 1px solid #2a2e36;
    user-select: none;
  }
  button, input, select {
    background: #262b33; color: #e8eaed; border: 1px solid #3a4150;
    border-radius: 6px; padding: 5px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { background: #323947; }
  button.primary { background: #2b62d9; border-color: #2b62d9; }
  button.primary:hover { background: #3a72ea; }
  button.danger:hover { background: #a33; }
  input[type=number] { width: 90px; }
  input[type=range] { width: 110px; padding: 0; }
  .sep { width: 1px; height: 22px; background: #3a4150; margin: 0 4px; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }
  #wrap { position: relative; }
  canvas { display: block; background: #000; cursor: crosshair; }
  #statusbar {
    display: flex; gap: 18px; padding: 6px 12px; background: #1d2026;
    border-top: 1px solid #2a2e36; color: #aab2c0; user-select: none;
  }
  #saveState { margin-left: auto; }
  #saveState.dirty { color: #e8b339; }
  .hint { color: #79808f; }
  kbd {
    background: #262b33; border: 1px solid #3a4150; border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font: 12px/1.6 monospace;
  }
</style>
</head>
<body>
<div id="toolbar">
  <button id="prev" title="上一帧(←)">&#9664; 上一帧</button>
  <button id="next" title="下一帧(→)">下一帧 &#9654;</button>
  <input id="jump" type="number" min="1" step="1">
  <button id="jumpBtn">跳转</button>
  <div class="sep"></div>
  <button id="copyPrev" title="把上一帧的框复制过来(V)">复制上一帧的框</button>
  <button id="clearCur" class="danger" title="清空本帧所有框">清空本帧</button>
  <button id="delSel" class="danger" title="删除选中框(Del)">删除选中</button>
  <div class="sep"></div>
  <label class="hint">模糊强度
    <input id="strength" type="range" min="15" max="70" value="35"> <span id="strengthVal">0.35</span>
  </label>
  <button id="applyCur" class="primary" title="把本帧的框真实模糊写回图片">应用模糊到本帧</button>
  <button id="applyAll" class="primary" title="把所有带框的帧真实模糊写回图片">应用模糊到全部带框帧</button>
  <div class="sep"></div>
  <button id="restoreBtn" title="从视频重新抽取一段帧,撤销已写的模糊">恢复帧范围…</button>
</div>
<div id="stage"><div id="wrap"><canvas id="cv"></canvas></div></div>
<div id="statusbar">
  <span id="pos">- / -</span>
  <span id="time"></span>
  <span id="rectInfo">本帧 0 个框</span>
  <span class="hint">拖拽画框 | 点击框选中拖动 | 右键点框删除 | <kbd>←</kbd><kbd>→</kbd> 翻帧 | <kbd>V</kbd> 复制上一帧框 | <kbd>Del</kbd> 删除选中 | <kbd>Ctrl+Z</kbd> 撤销</span>
  <span id="saveState"></span>
</div>
<script>
"use strict";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);

let frames = [];            // ["f_00001.jpg", ...]
let boxes = {};             // { "1050": [{x,y,w,h}], ... } 原图坐标
let cur = 0;                // 当前帧下标(0-based)
let scale = 1;              // 显示 / 原图
let imgW = 0, imgH = 0;
let imgCache = new Map();   // name -> Image(已加载)
let pending = new Map();    // name -> Image(加载中)
let selected = -1;
let drag = null;            // {mode:"new"|"move", x0,y0, rect}
let saveTimer = null;
let dirty = false;

const PRELOAD = 10;

function frameNo(i) { return i + 1; }                    // 文件序号=帧号
function keyOf(i) { return String(frameNo(i)); }
function curRects() {
  const k = keyOf(cur);
  if (!boxes[k]) boxes[k] = [];
  return boxes[k];
}

function getImage(name) {
  if (imgCache.has(name)) return imgCache.get(name);
  if (pending.has(name)) return pending.get(name);
  const im = new Image();
  const p = new Promise(res => { im.onload = () => res(im); im.onerror = () => res(null); });
  im.src = "/frames/" + name;
  imgCache.set(name, im);
  pending.set(name, p);
  p.then(() => pending.delete(name));
  if (imgCache.size > 120) {
    for (const k of imgCache.keys()) { imgCache.delete(k); if (imgCache.size <= 90) break; }
  }
  return im;
}

async function setImage(i) {
  const im = getImage(frames[i]);
  if (!im.complete || !im.naturalWidth) await pending.get(frames[i]);
  return im;
}

async function show(i) {
  cur = Math.max(0, Math.min(frames.length - 1, i));
  selected = -1;
  const im = await setImage(cur);
  if (!im) { requestAnimationFrame(() => show(cur + 1)); return; }
  imgW = im.naturalWidth; imgH = im.naturalHeight;
  // 只在尺寸变化时重设 canvas,避免每帧重置造成的闪动
  fitCanvas();
  preload();
  draw(im);
  updateStatus();
  $("jump").value = frameNo(cur);
  localStorage.setItem("maskbox.cur", String(cur));
}

function fitCanvas() {
  const st = document.getElementById("stage");
  const availW = st.clientWidth - 20, availH = st.clientHeight - 20;
  scale = Math.min(availW / imgW, availH / imgH);
  const w = Math.round(imgW * scale), h = Math.round(imgH * scale);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const wrap = document.getElementById("wrap");
  wrap.style.width = w + "px"; wrap.style.height = h + "px";
}

function preload() {
  for (let d = 1; d <= PRELOAD; d++) {
    if (cur + d < frames.length) getImage(frames[cur + d]);
    if (cur - d >= 0) getImage(frames[cur - d]);
  }
}

function draw(im) {
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(im, 0, 0, cv.width, cv.height);
  const rects = curRects();
  const blurPx = Math.max(4, 10 * scale);
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    const x = r.x * scale, y = r.y * scale, w = r.w * scale, h = r.h * scale;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.filter = "blur(" + blurPx + "px)";
    ctx.drawImage(im, 0, 0, cv.width, cv.height);
    ctx.restore();
    if (selected === i) {   // 只给选中框一条淡蓝细线,普通框不描边
      ctx.save();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "rgba(130,180,255,0.75)";
      ctx.strokeRect(x + .5, y + .5, w, h);
      ctx.restore();
    }
  }
  ctx.restore();
}

function redraw() { setImage(cur).then(im => { if (im) draw(im); }); }

function updateStatus() {
  $("pos").textContent = "帧 " + frameNo(cur) + " / " + frames.length;
  const sec = frameNo(cur) / 30;
  $("time").textContent = sec.toFixed(2) + " 秒";
  $("rectInfo").textContent = "本帧 " + curRects().length + " 个框";
}

/* ---------------- 保存与撤销 ---------------- */
const undoStack = [];
function pushSnapshot(json) {
  undoStack.push(json);
  if (undoStack.length > 80) undoStack.shift();
}
function snapshotNow() { pushSnapshot(JSON.stringify(boxes)); }
function undo() {
  if (!undoStack.length) { flash("没有可撤销的操作"); return; }
  boxes = JSON.parse(undoStack.pop());
  selected = -1;
  markDirty(); redraw();
}
function markDirty() {
  dirty = true;
  $("saveState").textContent = "保存中…";
  $("saveState").className = "dirty";
  updateStatus();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveBoxes, 250);
}
async function saveBoxes() {
  try {
    await fetch("/api/boxes", { method: "POST", body: JSON.stringify(boxes) });
    dirty = false;
    $("saveState").textContent = "已保存";
    $("saveState").className = "";
  } catch { $("saveState").textContent = "保存失败"; }
}

/* ---------------- 鼠标 ---------------- */
function toImg(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / scale,
    y: (e.clientY - r.top) / scale,
  };
}
function hitRect(p) {
  const rects = curRects();
  for (let i = rects.length - 1; i >= 0; i--) {
    const r = rects[i];
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return i;
  }
  return -1;
}

cv.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const p = toImg(e);
  const hit = hitRect(p);
  if (hit >= 0) {
    selected = hit;
    const r = curRects()[hit];
    drag = { mode: "move", x0: p.x, y0: p.y, orig: { ...r }, rect: r, undo: JSON.stringify(boxes) };
  } else {
    selected = -1;
    drag = { mode: "new", x0: p.x, y0: p.y, rect: null, undo: JSON.stringify(boxes) };
  }
  redraw();
});
cv.addEventListener("mousemove", e => {
  if (!drag) return;
  const p = toImg(e);
  if (drag.mode === "new") {
    const x = Math.min(drag.x0, p.x), y = Math.min(drag.y0, p.y);
    const w = Math.abs(p.x - drag.x0), h = Math.abs(p.y - drag.y0);
    drag.rect = { x, y, w, h };
    // 临时预览:画在 selected 位置
    const rects = curRects();
    if (selected === -1 || rects[selected] !== drag.rect) {
      if (selected >= 0 && rects[selected] !== drag.rect) selected = -1;
      rects.push(drag.rect);
      selected = rects.length - 1;
    } else {
      rects[selected] = drag.rect;
    }
  } else if (drag.mode === "move") {
    const r = drag.rect;
    r.x = drag.orig.x + (p.x - drag.x0);
    r.y = drag.orig.y + (p.y - drag.y0);
  }
  redraw();
});
window.addEventListener("mouseup", e => {
  if (!drag) return;
  let changed = false;
  if (drag.mode === "new") {
    const r = drag.rect;
    if (!r || r.w < 5 || r.h < 4) {
      const rects = curRects();
      if (selected >= 0 && rects[selected] === r) { rects.splice(selected, 1); selected = -1; }
    } else {
      r.x = Math.round(r.x); r.y = Math.round(r.y);
      r.w = Math.round(r.w); r.h = Math.round(r.h);
      changed = true;
    }
  } else if (drag.mode === "move") {
    const r = drag.rect;
    r.x = Math.round(r.x); r.y = Math.round(r.y);
    changed = r.x !== drag.orig.x || r.y !== drag.orig.y;
  }
  if (changed) pushSnapshot(drag.undo);
  drag = null;
  if (changed) markDirty();
  redraw();
});
cv.addEventListener("contextmenu", e => {
  e.preventDefault();
  const hit = hitRect(toImg(e));
  if (hit >= 0) {
    snapshotNow();
    curRects().splice(hit, 1);
    selected = -1; markDirty(); redraw();
  }
});

/* ---------------- 键盘 ---------------- */
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type === "number") return;
  if (e.key === "ArrowLeft") { e.preventDefault(); show(cur - 1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); show(cur + 1); }
  else if (e.key === "PageUp") { e.preventDefault(); show(cur - 30); }
  else if (e.key === "PageDown") { e.preventDefault(); show(cur + 30); }
  else if (e.key === "Delete" || e.key === "d") {
    if (selected >= 0) {
      snapshotNow();
      curRects().splice(selected, 1); selected = -1; markDirty(); redraw();
    }
  }
  else if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {
    e.preventDefault(); undo();
  }
  else if (e.key === "v" || e.key === "V") { if (!e.ctrlKey && !e.metaKey) copyPrev(); }
});

/* ---------------- 工具栏 ---------------- */
function copyPrev() {
  if (cur === 0) return;
  const src = boxes[keyOf(cur - 1)];
  if (!src || !src.length) { flash("上一帧没有框"); return; }
  snapshotNow();
  boxes[keyOf(cur)] = src.map(r => ({ ...r }));
  markDirty(); redraw();
}
function clearCur() {
  snapshotNow();
  boxes[keyOf(cur)] = [];
  selected = -1; markDirty(); redraw();
}
let flashTimer = null;
function flash(msg) {
  const el = $("saveState");
  el.textContent = msg; el.className = "dirty";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.textContent = dirty ? "保存中…" : "已保存"; el.className = dirty ? "dirty" : ""; }, 1500);
}
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur + 1);
$("jumpBtn").onclick = () => { const v = parseInt($("jump").value, 10); if (v >= 1) show(v - 1); };
$("jump").addEventListener("keydown", e => { if (e.key === "Enter") $("jumpBtn").onclick(); });
$("copyPrev").onclick = copyPrev;
$("clearCur").onclick = clearCur;
$("delSel").onclick = () => { if (selected >= 0) { snapshotNow(); curRects().splice(selected, 1); selected = -1; markDirty(); redraw(); } };
$("strength").oninput = () => { $("strengthVal").textContent = ($("strength").value / 100).toFixed(2); };

async function applyBlur(scope) {
  const count = Object.entries(boxes).filter(([, v]) => v.length).length;
  if (!count) { flash("还没有任何框"); return; }
  const msg = scope === "all"
    ? `把 ${count} 个带框的帧真实模糊写回图片?(可用"恢复帧范围"撤销)`
    : "把当前帧真实模糊写回图片?(可用\"恢复帧范围\"撤销)";
  if (!confirm(msg)) return;
  const body = {
    scope,
    frame: frameNo(cur),
    strength: $("strength").value / 100,
    boxes,
  };
  const res = await fetch("/api/apply", { method: "POST", body: JSON.stringify(body) });
  const data = await res.json();
  if (data.ok) {
    imgCache.delete(frames[cur]); pending.delete(frames[cur]);
    show(cur);
    flash(`已模糊写回 ${data.frames} 帧`);
  } else flash("失败:" + (data.error || ""));
}
$("applyCur").onclick = () => applyBlur("current");
$("applyAll").onclick = () => applyBlur("all");

$("restoreBtn").onclick = async () => {
  const s = prompt("恢复起始帧号(含):", "1");
  if (!s) return;
  const e2 = prompt("恢复结束帧号(含):", String(frames.length));
  if (!e2) return;
  if (!confirm(`将从视频重新抽取第 ${s} ~ ${e2} 帧,覆盖现有图片(撤销这些帧的模糊)。继续?`)) return;
  const res = await fetch("/api/restore", {
    method: "POST", body: JSON.stringify({ start: +s, end: +e2 }),
  });
  const data = await res.json();
  if (data.ok) { flash(`已恢复 ${data.restored} 帧`); show(cur); }
  else flash("失败:" + (data.error || ""));
};

window.addEventListener("resize", () => { fitCanvas(); redraw(); });

/* ---------------- 启动 ---------------- */
(async () => {
  const st = await (await fetch("/api/state")).json();
  frames = st.frames;
  boxes = st.boxes || {};
  const saved = parseInt(localStorage.getItem("maskbox.cur") || "1", 10);
  await show(Math.min(Math.max(saved - 1, 0), frames.length - 1));
})();
</script>
</body>
</html>
